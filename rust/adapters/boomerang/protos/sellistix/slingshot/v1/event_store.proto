
syntax = "proto3";

package sellistix.slingshot.v1;

option csharp_namespace = "Sellistix.Slingshot.Protos.V1";

// ─────────────────────────────────────────────────────────────────────────────
// EventStore service — exposes IEventStore + IStreamRegistry + portable Subscribe
// over gRPC. RaftNode uses EventStoreGrpcService; InMemory/SQL/embedded hosts use
// PortableEventStoreGrpcService. Clients: RaftGrpcEventStore / GrpcEventStoreSubscriptions.
// ─────────────────────────────────────────────────────────────────────────────
service EventStoreService {
  // ── Writes ──────────────────────────────────────────────────────────────
  rpc AppendStream    (AppendStreamRequest)    returns (AppendResponse);
  rpc AppendDcb       (AppendDcbRequest)       returns (AppendResponse);

  // ── Reads ────────────────────────────────────────────────────────────────
  rpc ReadStream          (ReadStreamRequest)         returns (ReadStreamResponse);
  rpc ReadStreamEnumerable(ReadStreamRequest)         returns (stream SequencedEventProto);
  rpc ReadByQuery         (ReadByQueryRequest)        returns (ReadByQueryResponse);
  rpc ReadByQueryStream   (ReadByQueryStreamRequest)  returns (stream SequencedEventProto);

  // ── Portable subscriptions (Pack D P4 — public log-tail; NOT Raft peer replication) ──
  // from_sequence_position is inclusive. Catch-up → live is transparent (no phase field).
  // Client-owned cursor: reconnect with lastApplied + 1. At-least-once delivery.
  rpc Subscribe           (SubscribeRequest)          returns (stream SequencedEventProto);
  rpc GetCurrentSequence  (GetCurrentSequenceRequest) returns (GetCurrentSequenceResponse);

  // ── Registry ─────────────────────────────────────────────────────────────
  rpc GetStream                  (GetStreamRequest)               returns (GetStreamResponse);
  rpc GetStreamsByAggregateType  (GetStreamsByAggregateTypeRequest) returns (StreamListResponse);
  rpc GetStreamsByTag            (GetStreamsByTagRequest)          returns (StreamListResponse);
  rpc EnumerateStreamIds         (EnumerateStreamIdsRequest)       returns (StreamIdsResponse);
  rpc GetStreamCount             (GetStreamCountRequest)           returns (GetStreamCountResponse);
  rpc GetStreamsUpdatedAfter      (GetStreamsUpdatedAfterRequest)   returns (StreamListResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Shared: serialized event
// ─────────────────────────────────────────────────────────────────────────────
message SerializedEventProto {
  string type_name      = 1;  // Catalog family token, not a CLR FullName
  bytes  payload        = 2;  // Opaque event payload bytes (codec named by codec_id)
  reserved 3;                 // was string content_type — do not reuse (K11)
  int32  schema_version = 4;  // First-class family version as stamped by the writer
  // Codec id (K4): 1 JSON · 2 MemoryPack · 3 Avro · 4 Protobuf.
  // 1–63 LawnDart-reserved. 64–254 user-registered. 255 opaque / unspecified bytes.
  // 0 is never valid on a durable frame.
  uint32 codec_id       = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Shared: sequenced event (read response item)
// ─────────────────────────────────────────────────────────────────────────────
message SequencedEventProto {
  SerializedEventProto event            = 1;
  int64                sequence_position = 2;
  string               stream_id         = 3;
  int64                version           = 4;
  bytes                metadata_json     = 5;   // JSON-encoded EventMetadata
  repeated string      tags              = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Shared: append result
// ─────────────────────────────────────────────────────────────────────────────
message AppendResponse {
  repeated int64 sequence_positions  = 1;
  bytes          consistency_marker  = 2;   // empty = not populated
  int64          last_stream_version = 3;   // -1 = not populated
  // Populated when this node is not the leader
  bool           not_leader          = 4;
  string         leader_endpoint     = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// AppendStream
// ─────────────────────────────────────────────────────────────────────────────
message AppendStreamRequest {
  string                    stream_id        = 1;
  repeated SerializedEventProto events       = 2;
  sint64                    expected_version = 3;   // -1 = no check
  bytes                     metadata_json    = 4;
  repeated string           tags             = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// AppendDcb
// ─────────────────────────────────────────────────────────────────────────────
message AppendDcbRequest {
  repeated SerializedEventProto events         = 1;
  bytes                         condition_json = 2;   // JSON-encoded AppendCondition
  bytes                         metadata_json  = 3;
  repeated string               tags           = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// ReadStream / ReadStreamEnumerable
// ─────────────────────────────────────────────────────────────────────────────
message ReadStreamRequest {
  string stream_id      = 1;
  int64  from_version   = 2;
  sint64 to_version     = 3;   // -1 = no limit
  int64  to_timestamp   = 4;   // UTC ticks, 0 = no limit
}

message ReadStreamResponse {
  repeated SequencedEventProto events = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Query (native proto; JSON query_json remains a fallback)
// ─────────────────────────────────────────────────────────────────────────────
message QueryItemProto {
  repeated string types = 1;
  repeated string tags  = 2;
}

message QueryProto {
  repeated QueryItemProto items = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// ReadByQuery
// ─────────────────────────────────────────────────────────────────────────────
message ReadByQueryRequest {
  bytes  query_json             = 1;   // JSON-encoded Query (fallback)
  sint64 from_sequence_position = 2;   // -1 = from start
  sint32 limit                  = 3;   // 0 = no limit
  sint64 to_sequence_position   = 4;   // -1 = no limit
  int64  to_timestamp           = 5;   // UTC ticks, 0 = no limit
  QueryProto query              = 6;   // preferred when items are present
}

message ReadByQueryResponse {
  repeated SequencedEventProto events             = 1;
  bytes                        consistency_marker = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// ReadByQueryStream
// ─────────────────────────────────────────────────────────────────────────────
message ReadByQueryStreamRequest {
  bytes  query_json             = 1;   // JSON-encoded Query (fallback)
  sint64 from_sequence_position = 2;
  sint64 to_sequence_position   = 3;
  int64  to_timestamp           = 4;
  sint32 limit                  = 5;   // 0 = unbounded
  QueryProto query              = 6;   // preferred when items are present
}

// ─────────────────────────────────────────────────────────────────────────────
// Registry
// ─────────────────────────────────────────────────────────────────────────────
message StreamMetadataProto {
  string          stream_id             = 1;
  string          tenant_id             = 2;
  string          aggregate_type        = 3;
  string          aggregate_id          = 4;   // Guid string, empty if not set
  int64           current_version       = 5;
  int64           last_sequence_position = 6;
  int64           created_at_ticks      = 7;   // UTC ticks
  int64           last_event_at_ticks   = 8;
  int64           event_count           = 9;
  repeated string tags                  = 10;
  string          status                = 11;  // "Active" | "Archived" | "Deleted"
}

message GetStreamRequest         { string stream_id = 1; }
message GetStreamResponse        { StreamMetadataProto stream = 1; bool found = 2; }

message GetStreamsByAggregateTypeRequest { string aggregate_type = 1; }
message GetStreamsByTagRequest           { string tag = 1; }
message StreamListResponse               { repeated StreamMetadataProto streams = 1; }

message EnumerateStreamIdsRequest  { string prefix = 1; }
message StreamIdsResponse          { repeated string stream_ids = 1; }

message GetStreamCountRequest  { string prefix = 1; }  // empty = all streams
message GetStreamCountResponse { int64  count  = 1; }

message GetStreamsUpdatedAfterRequest {
  int64  after_sequence_position = 1;
  sint32 limit                   = 2;   // 0 = no limit
}

// ─────────────────────────────────────────────────────────────────────────────
// Subscribe / GetCurrentSequence (portable Core IEventStoreSubscriptions)
// ─────────────────────────────────────────────────────────────────────────────
message SubscribeRequest {
  string subscriber_id           = 1;   // logging / metrics only (client-owned cursor)
  int64  from_sequence_position  = 2;   // inclusive start
  oneof scope {
    bool   global_all = 3;              // EventSubscriptionFilter.All
    string stream_id  = 4;              // EventSubscriptionFilter.ForStream
    bytes  query_json = 5;              // EventSubscriptionFilter.ForQuery (JSON Query)
  }
}

message GetCurrentSequenceRequest {}

message GetCurrentSequenceResponse {
  int64 current_sequence = 1;
}


